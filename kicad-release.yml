project_name: thermal-camera-v2
output: production-files

# {{.Version}} will be replaced with the git tag. 

# List of PCBs that will be processed. This will:
# - Validate the Schematic ERC
# - Validate the PCB DRC
# - Make release files (gerber, BOM, placement file)
pcbs:
- id: tc2-main-pcb
  text_variables:
    - key: TAG
      val: {{.Version}}
    - key: HASH
      val: {{.GIT_HASH}}

- id: tc2-mic-pcb
  text_variables:
    - key: TAG
      val: {{.Version}}
    - key: HASH
      val: {{.GIT_HASH}}

- id: tc2-plugs-buck-boost-pcb
  text_variables:
    - key: TAG
      val: {{.Version}}
    - key: HASH
      val: {{.GIT_HASH}}

- id: tc2-sim-usb-pcb
  text_variables:
    - key: TAG
      val: {{.Version}}
    - key: HASH
      val: {{.GIT_HASH}}

- id: tc2-sim-usb-pi3-pcb
  text_variables:
    - key: TAG
      val: {{.Version}}
    - key: HASH
      val: {{.GIT_HASH}}

# List of PCBs that will be built. This will:
# - Run the panel script.
# - Validate the PCB DRC
# - Make release files (gerber, BOM, placement file)
panels:
- id: tc2-panel
  path: .generated-pcbs/tc2-panel
  script: ./panel-tc2.py
  text_variables:
    - key: TAG
      val: {{.Version}}
    - key: HASH
      val: {{.GIT_HASH}}
  boms_to_join:
    - id: "tc2-main-pcb"
      refRenamer: "{orig}"
    - id: "tc2-plugs-buck-boost-pcb"
      refRenamer: "{orig}"
    - id: "tc2-sim-usb-pcb"
      refRenamer: "{orig}"

- id: tc2-mic-panel
  path: .generated-pcbs/tc2-mic-panel
  script: ./panel-tc2-mic.py
  # A production script is needed for PCBs that need v-cuts as the v-cuts are marked on the
  # edge cut layer. So if this was used for the DRC checks it would fail.
  productionScript: ./panel-tc2-mic.py --production 
  text_variables:
  - key: TAG
    val: {{.Version}}
  - key: HASH
    val: {{.GIT_HASH}}
  boms_to_join:
  - id: "tc2-mic-pcb"
    refRenamer: "{orig}-{n}"  # Update this from the script
    count: 10

- id: tc2-sim-usb-pi3-panel
  path: .generated-pcbs/tc2-sim-usb-pi3-panel
  script: ./panel-tc2-sim-usb-pi3-pcb.py
  text_variables:
  - key: TAG
    val: {{.Version}}
  - key: HASH
    val: {{.GIT_HASH}}
  boms_to_join:
  - id: "tc2-sim-usb-pi3-pcb"
    refRenamer: "{orig}-{n}"  # Update this from the script
    count: 16
