project_name: thermal-camera-v2
output: production-files

# {{.Version}} will be replaced with the git tag. 

# List of PCBs that will be processed. This will:
# - Validate the Schematic ERC
# - Validate the PCB DRC
# - Make release files (gerber, BOM, placement file)
pcbs:
- id: tc2-main-pcb
  text_variables:
    - key: TAG
      val: {{.Version}}
    - key: HASH
      val: {{.GIT_HASH}}

- id: tc2-mic-pcb
  text_variables:
    - key: TAG
      val: {{.Version}}
    - key: HASH
      val: {{.GIT_HASH}}

- id: tc2-plugs-buck-boost-pcb
  text_variables:
    - key: TAG
      val: {{.Version}}
    - key: HASH
      val: {{.GIT_HASH}}

- id: tc2-sim-usb-pcb
  text_variables:
    - key: TAG
      val: {{.Version}}
    - key: HASH
      val: {{.GIT_HASH}}

# List of PCBs that will be built. This will:
# - Run the panel script.
# - Validate the PCB DRC
# - Make release files (gerber, BOM, placement file)
panels:
- id: tc2-panel
  path: .generated-pcbs/tc2-panel
  script: ./panel-tc2.py
  text_variables:
    - key: TAG
      val: {{.Version}}
    - key: HASH
      val: {{.GIT_HASH}}
  boms_to_join:
    - id: "tc2-main-pcb"
      refRenamer: "{orig}"
    - id: "tc2-plugs-buck-boost-pcb"
      refRenamer: "{orig}"
    - id: "tc2-sim-usb-pcb"
      refRenamer: "{orig}"
